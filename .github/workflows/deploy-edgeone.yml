name: Deploy to EdgeOne Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # makers deploy = 新版 EdgeOne Makers 管道（旧 `pages deploy` 已废弃）。
      # 按官方文档，CLI 会自动构建项目再上传发布，SSR 函数由 Makers 的
      # Node 22 运行时执行（支持 @edgeone/astro 的 Response 协议）。
      # SERVER_ADAPTER 必须显式传给 CLI 的内部构建（Actions 里检测不到平台）。
      # -a overseas = 全球可用区（不含中国大陆），免 ICP 备案
      - name: Deploy to EdgeOne Makers
        run: npx -y edgeone@1.6.44 makers deploy -a overseas -n broadcast-channel -t ${{ secrets.EDGEONE_API_TOKEN }} --json
        env:
          SERVER_ADAPTER: edgeone
          CHANNEL: ${{ secrets.CHANNEL }}
          LOCALE: zh-CN
          TIMEZONE: Asia/Shanghai
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
