name: Deploy to EdgeOne Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Actions 上检测不到 EdgeOne 平台，必须显式指定适配器，
      # 否则会回退到 node standalone，产物结构不对
      - name: Build
        run: pnpm build
        env:
          SERVER_ADAPTER: edgeone
          CHANNEL: ${{ secrets.CHANNEL }}
          LOCALE: zh-CN
          TIMEZONE: Asia/Shanghai

      # makers deploy = 新版 EdgeOne Makers 管道（旧 `pages deploy` 已废弃，
      # 其 Node 函数运行时不消费 @edgeone/astro 生成的 Response，导致 200 空白）
      # -a overseas = 全球可用区（不含中国大陆），免 ICP 备案
      # 项目不存在时 CLI 会自动创建；加速区域在首次创建时固定
      - name: Deploy to EdgeOne Makers
        run: npx -y edgeone@1.6.44 makers deploy ./.edgeone -a overseas -n broadcast-channel -t ${{ secrets.EDGEONE_API_TOKEN }} --json
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
