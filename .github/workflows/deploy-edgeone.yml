name: Deploy to EdgeOne Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Actions 上检测不到 EdgeOne 平台，必须显式指定适配器，
      # 否则会回退到 node standalone，产物结构不对
      - name: Build
        run: pnpm build
        env:
          SERVER_ADAPTER: edgeone
          CHANNEL: ${{ secrets.CHANNEL }}
          LOCALE: zh-CN
          TIMEZONE: Asia/Shanghai

      # 产物目录 .edgeone/（assets/ 静态文件 + cloud-functions/ssr-node/ SSR 入口）
      # -a overseas = 全球可用区（不含中国大陆），免 ICP 备案
      # 项目不存在时 CLI 会自动创建；加速区域在首次创建时固定
      - name: Deploy to EdgeOne Pages
        run: npx edgeone pages deploy ./.edgeone -a overseas -n broadcast-channel -t ${{ secrets.EDGEONE_API_TOKEN }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
